<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de CEP - ViaCEP</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    input {
      padding: 8px;
      width: 60%;
      font-size: 16px;
    }
    button {
      padding: 8px 15px;
      font-size: 16px;
      cursor: pointer;
    }
    .erro {
      color: red;
      font-weight: bold;
    }
    .resultado {
      margin-top: 20px;
      padding: 10px;
      background-color: #f9f9f9;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <h2>Busca de Endereço por CEP</h2>
  
  <div class="form-group">
    <input type="text" id="cepInput" placeholder="Digite o CEP (ex: 01001000)" maxlength="8">
    <button onclick="buscarCEP()">Buscar</button>
  </div>

  <div id="mensagem" class="erro"></div>
  <div id="resultado" class="resultado" style="display: none;"></div>

  <script>
    async function buscarCEP() {
      const cep = document.getElementById('cepInput').value.trim();
      const mensagemEl = document.getElementById('mensagem');
      const resultadoEl = document.getElementById('resultado');

      // Limpar resultados anteriores
      mensagemEl.innerText = '';
      resultadoEl.style.display = 'none';
      resultadoEl.innerHTML = '';

      if (cep.length !== 8 || isNaN(cep)) {
        mensagemEl.innerText = 'Por favor, digite um CEP válido com 8 dígitos numéricos.';
        return;
      }

      try {
        const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
        
        if (!response.ok) {
          throw new Error('Erro na requisição');
        }

        const data = await response.json();

        if (data.erro) {
          mensagemEl.innerText = 'CEP não encontrado. Verifique o número e tente novamente.';
        } else {
          resultadoEl.style.display = 'block';
          resultadoEl.innerHTML = `
            <p><strong>Logradouro:</strong> ${data.logradouro || 'N/A'}</p>
            <p><strong>Bairro:</strong> ${data.bairro || 'N/A'}</p>
            <p><strong>Cidade:</strong> ${data.localidade}</p>
            <p><strong>Estado:</strong> ${data.uf}</p>
            <p><strong>DDD:</strong> ${data.ddd}</p>
          `;
        }
      } catch (error) {
        mensagemEl.innerText = 'Ocorreu um erro ao buscar o CEP. Tente novamente mais tarde.';
      }
    }
  </script>

</body>
</html>
